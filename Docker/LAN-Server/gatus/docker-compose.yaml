networks:
  ssankur:
    external: "true"

services:
  gatus:
    configs:
      - source: "config"
        target: "/config/config.yaml"
    container_name: "gatus"
    environment:
      - "TZ=Asia/Dhaka"
    extra_hosts:
      - "files.ssankur.com=10.1.4.2"
      - "gitea.ssankur.com=10.1.4.2"
      - "gotify.ssankur.com=10.1.4.2"
      - "hunt.ssankur.com=10.1.4.2"
      - "jellyfin.ssankur.com=10.1.4.2"
      - "mirotalk.ssankur.com=10.1.4.2"
      - "openspeedtest.ssankur.com=10.1.4.2"
      - "speedtest.ssankur.com=10.1.4.2"
    image: "ghcr.io/twin/gatus:latest"
    networks:
      - "ssankur"
    restart: "on-failure"

configs:
  config:
    content: |
      alerting:
        gotify:
          server-url: "https://gotify.ssankur.com"
          token: "${GOTIFY_TOKEN}"
          default-alert:
            failure-threshold: 1
            success-threshold: 1
            send-on-resolved: true

      endpoints:
        - name: "AdGuard Home"
          group: "LAN-Server"
          url: "http://adguard-home:3000"
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: "gotify"
        - name: "Adminer"
          group: "LAN-Server"
          url: "http://adminer:8080"
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: "gotify"
        - name: "Bazarr"
          group: "LAN-Server"
          url: "http://bazarr:6767"
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: "gotify"
        - name: "Dockhand"
          group: "LAN-Server"
          url: "http://dockhand:3000"
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: "gotify"
        - name: "Dozzle"
          group: "LAN-Server"
          url: "http://dozzle:8080"
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: "gotify"
        - name: "Ente Postgres"
          group: "LAN-Server"
          url: "tcp://ente-postgres:5432"
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: "gotify"
        - name: "Ente Server"
          group: "LAN-Server"
          url: "tcp://ente-server:8080"
          conditions:
            - "[CONNECTED] == true"
          alerts:
            - type: "gotify"
        - name: "Ente Web"
          group: "LAN-Server"
          url: "http://ente-web:3003"
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: "gotify"
        - name: "ESPHome"
          group: "LAN-Server"
          url: "http://esphome:6052"
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: "gotify"
        - name: "FlareSolverr"
          group: "LAN-Server"
          url: "http://flaresolverr:8191"
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: "gotify"
        - name: "Gatus"
