networks:
  ssankur:
    external: "true"

services:
  dockhand:
    container_name: "dockhand"
    environment:
      - "PGID=1000"
      - "PUID=1000"
      - "TZ=Asia/Dhaka"
    image: "fnsys/dockhand:latest"
    networks:
      - "ssankur"
    restart: "on-failure"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./mounts/data:/app/data"
