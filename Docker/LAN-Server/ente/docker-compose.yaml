networks:
  ssankur:
    external: "true"

services:
  ente-server:
    container_name: "ente-server"
    depends_on:
      ente-postgres:
        condition: "service_healthy"
    environment:
      - "ENTE_DB_HOST=ente-postgres"
      - "ENTE_DB_NAME=ente"
      - "ENTE_DB_PASSWORD=${DB_PASSWORD}"
      - "ENTE_DB_USER=ente"
    image: "ghcr.io/ente-io/server:latest"
    networks:
      - "ssankur"
    restart: "on-failure"

  ente-web:
    container_name: "ente-web"
    depends_on:
      ente-server:
        condition: "service_started"
    image: "ghcr.io/ente-io/web:latest"
    networks:
      - "ssankur"
    restart: "on-failure"

  ente-postgres:
    container_name: "ente-postgres"
    environment:
      - "POSTGRES_DB=ente"
      - "POSTGRES_PASSWORD=${DB_PASSWORD}"
      - "POSTGRES_USER=ente"
    healthcheck:
      test: "pg_isready -d ente -q -U ente"
    image: "postgres:17"
    networks:
      - "ssankur"
    restart: "on-failure"
    volumes:
      - "./mounts/postgres:/var/lib/postgresql/data"
