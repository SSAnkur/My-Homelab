networks:
  ssankur:
    external: "true"

services:
  traefik:
    configs:
      - source: "config"
        target: "/etc/traefik/config.yaml"
      - source: "traefik"
        target: "/etc/traefik/traefik.yaml"
    container_name: "traefik"
    environment:
      - "CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}"
      - "TZ=Asia/Dhaka"
    image: "traefik:latest"
    networks:
      - "ssankur"
    ports:
      - "10.1.1.253:80:80/tcp"
      - "10.1.1.253:443:443/tcp"
    restart: "on-failure"
    volumes:
      - "./mounts/letsencrypt:/etc/letsencrypt"

configs:
  config:
    content: |
      http:
        routers:
          adguard:
            rule: "Host(`adguard.ssankur.com`)"
            service: "adguard"
          adminer:
            rule: "Host(`adminer.ssankur.com`)"
            service: "adminer"
          bazarr:
            rule: "Host(`bazarr.ssankur.com`)"
            service: "bazarr"
          dockhand:
            rule: "Host(`dockhand.ssankur.com`)"
            service: "dockhand"
          dozzle:
