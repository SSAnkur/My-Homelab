            service: "dozzle"
          ente-auth:
            rule: "Host(`ente-auth.ssankur.com`)"
            service: "ente-auth"
          ente-server:
            rule: "Host(`ente-server.ssankur.com`)"
            service: "ente-server"
          esphome:
            rule: "Host(`esphome.ssankur.com`)"
            service: "esphome"
          gatus:
            rule: "Host(`gatus.ssankur.com`)"
            service: "gatus"
          gitea:
