          vaultwarden:
            loadBalancer:
              servers:
                - url: "http://vaultwarden"

  traefik:
    content: |
      api:
        disableDashboardAd: "true"
        insecure: "true"

      certificatesResolvers:
        letsencrypt:
          acme:
            dnsChallenge:
              propagation:
                delayBeforeChecks: "300"
                disableANSChecks: "true"
                disableChecks: "true"
              provider: "cloudflare"
            email: "ankur7914@gmail.com"
            storage: "/etc/letsencrypt/acme.json"

      entryPoints:
        http:
          address: ":80"
          http:
            redirections:
              entryPoint:
                to: "https"
        https:
          address: ":443"
          asDefault: "true"
          http:
            tls:
              certResolver: "letsencrypt"
              domains:
                - main: "ssankur.com"
                  sans:
                    - "*.ssankur.com"
      log:
        level: "INFO"

      providers:
        file:
          filename: "/etc/traefik/config.yaml"

      serversTransport:
        insecureSkipVerify: "true"
