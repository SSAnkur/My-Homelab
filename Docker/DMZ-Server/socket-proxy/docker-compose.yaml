networks:
  ssankur:
    external: "true"

services:
  socket-proxy:
    container_name: "socket-proxy"
    environment:
      - "ALLOW_ARCHIVE=1"
      - "ALLOW_CHANGES=1"
      - "ALLOW_EXPORT=1"
      - "ALLOW_LOGS=1"
      - "ALLOW_PAUSE=1"
      - "ALLOW_RESTARTS=1"
      - "ALLOW_STOP=1"
      - "ALLOW_START=1"
      - "ALLOW_TOP=1"
      - "ALLOW_UNPAUSE=1"
      - "AUTH=1"
      - "BUILD=1"
      - "COMMIT=1"
      - "CONFIGS=1"
      - "CONTAINERS=1"
      - "DISTRIBUTION=1"
      - "EVENTS=1"
      - "EXEC=1"
      - "IMAGES=1"
      - "INFO=1"
      - "NETWORKS=1"
      - "NODES=1"
      - "PING=1"
      - "PLUGINS=1"
      - "POST=1"
      - "SECRETS=1"
      - "SERVICES=1"
      - "SESSION=1"
      - "SWARM=1"
      - "SYSTEM=1"
      - "TASKS=1"
      - "TZ=Asia/Dhaka"
      - "VERSION=1"
      - "VOLUMES=1"
    image: "lscr.io/linuxserver/socket-proxy:latest"
    networks:
      - "ssankur"
    ports:
      - "10.1.4.2:2375:2375/tcp"
    restart: "on-failure"
    tmpfs:
      - "/run"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
