services:
  socket-proxy:
    container_name: "socket-proxy"
    environment:
      - "ALLOW_ARCHIVE=0"
      - "ALLOW_CHANGES=0"
      - "ALLOW_EXPORT=0"
      - "ALLOW_LOGS=1"
      - "ALLOW_PAUSE=0"
      - "ALLOW_RESTARTS=0"
      - "ALLOW_STOP=0"
      - "ALLOW_START=0"
      - "ALLOW_TOP=0"
      - "ALLOW_UNPAUSE=0"
      - "AUTH=0"
      - "BUILD=0"
      - "COMMIT=0"
      - "CONFIGS=0"
      - "CONTAINERS=1"
      - "DISTRIBUTION=0"
      - "EVENTS=1"
      - "EXEC=0"
      - "IMAGES=1"
      - "INFO=1"
      - "NETWORKS=1"
      - "NODES=0"
      - "PING=1"
      - "PLUGINS=0"
      - "POST=0"
      - "SECRETS=0"
      - "SERVICES=0"
      - "SESSION=0"
      - "SWARM=0"
      - "SYSTEM=1"
      - "TASKS=0"
      - "TZ=Asia/Dhaka"
      - "VERSION=1"
      - "VOLUMES=1"
    image: "lscr.io/linuxserver/socket-proxy:latest"
    network_mode: "bridge"
    ports:
      - "10.1.4.2:2375:2375/tcp"
    read_only: true
    restart: "on-failure"
    security_opt:
      - "no-new-privileges"
    tmpfs:
      - "/run"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
