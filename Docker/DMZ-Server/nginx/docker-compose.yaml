networks:
  ssankur:
    external: "true"

services:
  nginx:
    container_name: "nginx"
    environment:
      - "PGID=1000"
      - "PUID=1000"
      - "TZ=Asia/Dhaka"
    image: "lscr.io/linuxserver/nginx:latest"
    networks:
      - "ssankur"
    restart: "on-failure"
    volumes:
      - "./mounts/config:/config"
