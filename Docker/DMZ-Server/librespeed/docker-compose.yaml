networks:
  ssankur:
    external: "true"

services:
  librespeed:
    container_name: "librespeed"
    environment:
      - "DOCKER_MODS=ghcr.io/themepark-dev/theme.park:librespeed"
      - "PASSWORD=${PASSWORD}"
      - "PGID=1000"
      - "PUID=1000"
      - "TP_THEME=dracula"
      - "TZ=Asia/Dhaka"
    image: "lscr.io/linuxserver/librespeed:latest"
    networks:
      - "ssankur"
    restart: "on-failure"
    volumes:
      - "./mounts/config:/config"
