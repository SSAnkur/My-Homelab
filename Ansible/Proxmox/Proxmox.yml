- name: Configure Proxmox
  hosts: Proxmox
  gather_facts: false
  roles:
    - base
    - bash
    - cron
  tasks:
    - name: Clean Package Files
      ansible.builtin.apt:
        clean: true

    - name: Update Package Cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade Packages
      ansible.builtin.apt:
        upgrade: "yes"

    - name: Remove Unused Packages And Purge Config Files
      ansible.builtin.apt:
        autoremove: true
        purge: true

    - name: Check If Reboot Required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Send Notification If Reboot Required
      ansible.builtin.uri:
        url: "https://gotify.ssankur.com/message?token={{ gotify_token }}"
        method: POST
        body_format: json
        body:
          message: Proxmox Reboot Required
      when: reboot_required.stat.exists
