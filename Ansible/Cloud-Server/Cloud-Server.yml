- name: Configure Cloud Server
  hosts: Cloud-Server
  become: true
  gather_facts: false
  roles:
    - base
    - bash
    - repos
    - packages
  tasks:
    - name: Enable IP Forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: 1
        reload: true

    - name: Copy WireGuard Config File
      ansible.builtin.copy:
        src: wg0.conf
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      register: wireguard_config

    - name: Enable WireGuard Service
      ansible.builtin.systemd_service:
        name: wg-quick@wg0
        enabled: true
        state: started

    - name: Restart WireGuard If Config Changed
      ansible.builtin.systemd_service:
        name: wg-quick@wg0
        state: restarted
      when: wireguard_config.changed
