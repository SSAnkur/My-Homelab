- name: Configure LAN Server
  hosts: LAN-Server
  become: true
  gather_facts: false
  roles:
    - base
    - bash
    - repos
    - packages
    - user
    - autofs
    - docker
    - cron
  tasks:
    - name: Enable Linger For User
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ ansible_user }}
        creates: "/var/lib/systemd/linger/{{ ansible_user }}"

    - name: Copy PipeWire Config Files
      become: false
      ansible.builtin.copy:
        src: pipewire
        dest: "/home/{{ ansible_user }}/.config/"
      register: pipewire_config

    - name: Restart PipeWire If Config Changed
      become: false
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        scope: user
        state: restarted
      loop:
        - pipewire
        - pipewire-pulse
        - wireplumber
      when: pipewire_config.changed

    - name: Copy Rclone Config File
      become: false
      ansible.builtin.copy:
        force: false
        src: ../../.config/rclone/rclone.conf
        dest: .config/rclone/
        mode: "0600"
